
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GreenEye - Crop Disease Detection</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/bootstrap.min.css') }}">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                GreenEye
            </a>
        </div>
    </nav>


    <!-- Main Content -->
    <main class="container mt-5">

        <div class="text-center">

            <h1>GreenEye</h1>

            <p class="text-muted">
                Crop Disease Detection
            </p>


            <!-- Image Upload Form -->
            <form action="/upload/"
                  method="POST"
                  enctype="multipart/form-data"
                  class="mt-4">

                <div class="mb-3">

                    <input
                        type="file"
                        name="img"
                        accept="image/png, image/jpeg, image/jpg"
                        class="form-control"
                        required>

                </div>

                <button
                    type="submit"
                    class="btn btn-success">

                    Detect Disease

                </button>

            </form>


            <!-- Prediction Result -->
            {% if result %}

            <div class="result-container mt-5">

                <h2>Prediction Result</h2>


                <!-- Uploaded Image -->
                <div class="mt-3">

                    <img
                        src="{{ imagepath }}"
                        alt="Uploaded crop leaf"
                        class="result-image">

                </div>


                <!-- Disease Information -->
                <div class="result-text mt-4">

                    <h3>
                        {{ prediction["name"] }}
                    </h3>

                    <p>
                        <strong>Cause:</strong>
                        {{ prediction["cause"] }}
                    </p>

                    <p>
                        <strong>Cure:</strong>
                        {{ prediction["cure"] }}
                    </p>


                    <!-- Confidence -->
                    {% if confidence %}

                    <p>
                        <strong>Confidence:</strong>
                        {{ confidence }}%
                    </p>

                    {% endif %}

                </div>

            </div>

            {% endif %}

        </div>

    </main>


    <!-- Bootstrap JS -->
    <script src="{{ url_for('static',
        filename='js/bootstrap.bundle.min.js') }}">
    </script>

</body>

</html>
